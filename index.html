<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>인적자원개발론 학습노트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* Design: Notion-inspired (voltagent/awesome-design-md → notion/DESIGN.md) */
:root{
  --primary:#5645d4;--primary-pressed:#4534b3;--on-primary:#fff;
  --canvas:#ffffff;--surface:#f6f5f4;--surface-soft:#fafaf9;
  --hairline:#e5e3df;--hairline-strong:#c8c4be;
  --ink:#1a1a1a;--charcoal:#37352f;--slate:#5d5b54;--steel:#787671;--stone:#a4a097;
  --link:#0075de;--ok:#1aae39;--warn:#dd5b00;--err:#e03131;
  --t-peach:#ffe8d4;--t-rose:#fde0ec;--t-mint:#d9f3e1;--t-lav:#e6e0f5;--t-sky:#dcecfa;--t-yel:#fef7d6;--t-cream:#f8f5e8;--t-gray:#f0eeec;
  --case-bg:#f8f5e8;--case-bar:#c9a227;--lec-bg:#e6e0f5;--lec-bar:#5645d4;
  --shadow:0 1px 2px rgba(15,15,15,.06),0 4px 16px rgba(15,15,15,.06);
}
:root[data-theme="dark"]{
  --primary:#8b7cf0;--primary-pressed:#7262e6;--on-primary:#fff;
  --canvas:#191919;--surface:#202020;--surface-soft:#252525;
  --hairline:#2f2f2f;--hairline-strong:#444;
  --ink:#f1f1ef;--charcoal:#e3e2e0;--slate:#bdbab4;--steel:#9b9a97;--stone:#7d7a75;
  --link:#4ea3ff;--ok:#3ecf5e;--warn:#ff8a3d;--err:#ff6b6b;
  --t-peach:#3a2a1f;--t-rose:#3a2230;--t-mint:#1f3328;--t-lav:#2a2540;--t-sky:#1f2c3b;--t-yel:#37321c;--t-cream:#2e2b22;--t-gray:#2a2a2a;
  --case-bg:#2b281e;--case-bar:#c9a227;--lec-bg:#262140;--lec-bar:#8b7cf0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
  --primary:#8b7cf0;--primary-pressed:#7262e6;--on-primary:#fff;
  --canvas:#191919;--surface:#202020;--surface-soft:#252525;
  --hairline:#2f2f2f;--hairline-strong:#444;
  --ink:#f1f1ef;--charcoal:#e3e2e0;--slate:#bdbab4;--steel:#9b9a97;--stone:#7d7a75;
  --link:#4ea3ff;--ok:#3ecf5e;--warn:#ff8a3d;--err:#ff6b6b;
  --t-peach:#3a2a1f;--t-rose:#3a2230;--t-mint:#1f3328;--t-lav:#2a2540;--t-sky:#1f2c3b;--t-yel:#37321c;--t-cream:#2e2b22;--t-gray:#2a2a2a;
  --case-bg:#2b281e;--case-bar:#c9a227;--lec-bg:#262140;--lec-bar:#8b7cf0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas);color:var(--charcoal);
  font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
a{color:var(--link)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* Layout */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 20px;
  background:color-mix(in srgb,var(--canvas) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline)}
.brand{font-weight:700;color:var(--ink);font-size:15px;white-space:nowrap}
.brand small{color:var(--steel);font-weight:500;margin-left:6px}
.tabs{display:flex;gap:2px;margin-left:auto;background:var(--surface);padding:3px;border-radius:10px}
.tab{border:0;background:transparent;color:var(--slate);padding:6px 14px;border-radius:8px;font-size:14px;font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--canvas);color:var(--ink);box-shadow:var(--shadow)}
.icon-btn{border:1px solid var(--hairline);background:var(--canvas);color:var(--slate);border-radius:8px;width:34px;height:34px;display:grid;place-items:center}
.wrap{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 55px)}
.side{border-right:1px solid var(--hairline);background:var(--surface-soft);padding:16px 10px;position:sticky;top:55px;height:calc(100vh - 55px);overflow:auto}
.side h4{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--stone);margin:8px 10px;font-weight:600}
.lec-link{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;color:var(--slate);
  padding:7px 10px;border-radius:6px;font-size:14px;line-height:1.4}
.lec-link:hover{background:var(--t-gray)}
.lec-link[aria-current="true"]{background:var(--t-gray);color:var(--ink);font-weight:600}
.dot{flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--charcoal)}
main{padding:40px 48px 120px;max-width:920px;width:100%;margin:0 auto}
@media (max-width:860px){
  .wrap{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--hairline);display:flex;overflow-x:auto;gap:4px;padding:8px 16px}
  .side h4{display:none}
  .lec-link{flex:none;width:auto;white-space:nowrap}
  main{padding:24px 16px 96px}
  .top{flex-wrap:wrap;padding:10px 16px}
  .tabs{margin-left:0;order:3;width:100%;overflow-x:auto;scrollbar-width:none}
  .tab{padding:6px 10px;flex:1}
  .side{scrollbar-width:none}
  .top .icon-btn{margin-left:auto}
  h1{font-size:28px}
  .fc-face{padding:32px 20px}
}

/* Typography */
h1{font-size:36px;line-height:1.2;letter-spacing:-.5px;color:var(--ink);margin:8px 0 6px;font-weight:700}
h2{font-size:24px;line-height:1.3;color:var(--ink);margin:44px 0 12px;font-weight:700;letter-spacing:-.3px}
h3{font-size:19px;line-height:1.4;color:var(--ink);margin:30px 0 8px;font-weight:650}
h4{font-size:16px;color:var(--ink);margin:20px 0 6px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:1px;color:var(--steel);text-transform:uppercase}
.meta{color:var(--steel);font-size:14px}
.lead{font-size:17px;color:var(--slate);margin:6px 0 0}
p{margin:8px 0}
ul,ol{padding-left:22px;margin:6px 0}
li{margin:3px 0}
strong{color:var(--ink);font-weight:650}
mark{background:var(--t-yel);color:inherit;padding:0 3px;border-radius:3px}
hr{border:0;border-top:1px solid var(--hairline);margin:32px 0}
table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14.5px;display:block;overflow-x:auto}
th,td{border:1px solid var(--hairline);padding:8px 10px;vertical-align:top;text-align:left}
th{background:var(--surface);color:var(--ink);font-weight:600}

/* Note blocks */
.note h2:first-of-type{margin-top:28px}
.note h2{scroll-margin-top:72px}
@media (max-width:860px){.note h2{scroll-margin-top:110px}.grid.stats{grid-template-columns:repeat(2,1fr)}}
.case,.lecture,.tip,.warn{border-radius:8px;padding:12px 16px;margin:14px 0;border-left:3px solid}
.case{background:var(--case-bg);border-color:var(--case-bar)}
.case::before{content:"판례";display:block;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--case-bar);margin-bottom:2px}
.lecture{background:var(--lec-bg);border-color:var(--lec-bar)}
.lecture::before{content:"✎ 수업 필기";display:block;font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--lec-bar);margin-bottom:2px}
.tip{background:var(--t-mint);border-color:var(--ok)}
.tip::before{content:"시험 포인트";display:block;font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--ok);margin-bottom:2px}
.warn{background:var(--t-peach);border-color:var(--warn)}
.warn::before{content:"주의 · 헷갈림";display:block;font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--warn);margin-bottom:2px}
.toc{background:var(--surface);border-radius:12px;padding:16px 20px;margin:24px 0}
.toc a{color:var(--slate);text-decoration:none;display:block;padding:2px 0;font-size:14.5px}
.toc a:hover{color:var(--primary)}

/* Cards / grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin:20px 0}
.card{border:1px solid var(--hairline);border-radius:12px;padding:20px;background:var(--canvas)}
.card.tint{border:0}
.home-card{text-align:left;border:0;border-radius:12px;padding:20px;color:var(--charcoal);min-height:132px;display:flex;flex-direction:column;gap:6px;transition:transform .12s}
.home-card:hover{transform:translateY(-2px)}
.home-card b{font-size:17px;color:var(--ink);line-height:1.35}
.home-card span{font-size:13px;color:var(--slate)}
.stat{font-size:28px;font-weight:700;color:var(--ink);line-height:1.1}
.btn{border:1px solid transparent;border-radius:8px;padding:9px 18px;font-size:14px;font-weight:500;background:var(--primary);color:var(--on-primary)}
.btn:hover{background:var(--primary-pressed)}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--hairline-strong)}
.btn.sec:hover{background:var(--surface)}
.btn.ok{background:#178a2f;color:#fff} .btn.bad{background:#c92a2a;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:1px solid var(--hairline-strong);background:var(--canvas);color:var(--slate);border-radius:999px;padding:4px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
select,input[type=number],input[type=search]{font:inherit;font-size:14px;border:1px solid var(--hairline-strong);border-radius:8px;padding:7px 10px;background:var(--canvas);color:var(--ink)}
.panel{background:var(--surface);border-radius:12px;padding:18px 20px;margin:16px 0}
.panel label{font-size:13px;color:var(--steel);font-weight:600;display:block;margin-bottom:4px}

/* Memo */
.memo-item{display:grid;grid-template-columns:minmax(120px,32%) 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--hairline)}
.memo-item .k{font-weight:650;color:var(--ink)}
.memo-item .v{color:var(--charcoal)}
.hide .memo-item .v{filter:blur(6px);cursor:pointer;user-select:none;transition:filter .15s}
.hide .memo-item .v.show{filter:none}
@media (max-width:600px){.memo-item{grid-template-columns:1fr;gap:4px}}

/* Flashcards */
.fc-stage{perspective:1400px;margin:20px 0}
.fc{position:relative;width:100%;min-height:320px;transition:transform .45s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;padding:36px 32px;display:flex;flex-direction:column;justify-content:center;
  box-shadow:var(--shadow);border:1px solid var(--hairline);overflow:auto}
.fc-front{background:var(--canvas)}
.fc-back{background:var(--t-lav);transform:rotateY(180deg)}
.fc-face .q{font-size:22px;font-weight:650;color:var(--ink);line-height:1.45;text-align:center}
.fc-face .a{font-size:17px;line-height:1.7}
.fc-face .tag{position:absolute;top:14px;left:18px;font-size:12px;color:var(--steel)}
.fc-face .hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:12px;color:var(--stone)}
.progress{height:6px;background:var(--surface);border-radius:999px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--primary);transition:width .25s}
kbd{font:12px ui-monospace,monospace;border:1px solid var(--hairline-strong);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--slate)}

/* Quiz */
.q-box{border:1px solid var(--hairline);border-radius:14px;padding:24px;margin:16px 0;background:var(--canvas)}
.q-text{font-size:18px;font-weight:600;color:var(--ink);line-height:1.55;margin-bottom:14px;white-space:pre-line}
.opt{display:flex;gap:10px;width:100%;text-align:left;border:1px solid var(--hairline-strong);background:var(--canvas);color:var(--charcoal);
  border-radius:10px;padding:12px 14px;margin:8px 0;font-size:15.5px;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--primary);background:var(--surface-soft)}
.opt .n{flex:none;font-weight:700;color:var(--steel)}
.opt.correct{border-color:var(--ok);background:var(--t-mint)}
.opt.wrong{border-color:var(--err);background:var(--t-rose)}
.opt:disabled{cursor:default}
.explain{margin-top:14px;padding:14px 16px;border-radius:10px;background:var(--surface);font-size:15px}
.explain b.okc{color:var(--ok)} .explain b.badc{color:var(--err)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface);color:var(--slate)}
.empty{color:var(--steel);text-align:center;padding:40px 0}
.hist td,.hist th{font-size:13.5px}
.search-hit{padding:12px 0;border-bottom:1px solid var(--hairline)}
.search-hit small{color:var(--steel)}
.foot{margin-top:60px;color:var(--stone);font-size:12.5px}
/* HRD 노트 전용 블록 */
.law{background:var(--surface-soft);border:1px solid var(--hairline);border-radius:8px;padding:12px 16px;margin:14px 0}
.law .no{display:inline-block;font-size:12px;font-weight:700;color:var(--primary);background:var(--t-lav);border-radius:6px;padding:1px 8px;margin-right:8px;vertical-align:1px}
.star{color:var(--warn);font-weight:700}
.exam{display:inline-block;font-size:12px;font-weight:700;padding:1px 9px;border-radius:999px;background:var(--t-rose);color:var(--err);margin-left:4px;vertical-align:1px}
.skip{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px;background:var(--t-gray);color:var(--steel);margin-left:4px;vertical-align:1px}
.src{color:var(--steel);font-size:13.5px}
.u{background:var(--t-yel);border-radius:3px;padding:0 3px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0;font-size:14px}
.flow span{background:var(--surface);border:1px solid var(--hairline);border-radius:8px;padding:5px 10px;line-height:1.4}
.flow i{font-style:normal;color:var(--stone)}
.tw{margin:12px 0}
</style>
</head>
<body>
<header class="top">
  <div class="brand">인적자원개발론<small>2026-2 학습노트</small></div>
  <nav class="tabs" role="tablist">
    <button class="tab" data-view="home" role="tab">홈</button>
    <button class="tab" data-view="note" role="tab">정리노트</button>
    <button class="tab" data-view="memo" role="tab">암기노트</button>
    <button class="tab" data-view="cards" role="tab">플래시카드</button>
    <button class="tab" data-view="quiz" role="tab">문제은행</button>
  </nav>
  <button class="icon-btn" id="theme" title="다크 모드 전환" aria-label="다크 모드 전환">◐</button>
</header>
<div class="wrap">
  <aside class="side" id="side"></aside>
  <main id="main"></main>
</div>
<script src="data.js"></script>
<script>
const L = window.LECTURES || [];
const TINTS = ["--t-peach","--t-rose","--t-mint","--t-lav","--t-sky","--t-yel","--t-cream","--t-gray"];
const tint = i => `var(${TINTS[i % TINTS.length]})`;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lno = l => esc(l.no) + (/^\d+$/.test(l.no) ? "주" : "");
const store = {
  get(k, d) { try { const v = localStorage.getItem("hb:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("hb:" + k, JSON.stringify(v)); } catch {} }
};
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const known = store.get("selIds", null);  // ids that existed when sel was saved; newly added lectures start selected
const S = { view: "home", lec: L[0]?.id, sel: store.get("sel", L.map(l => l.id)).concat(known ? L.map(l => l.id).filter(id => !known.includes(id)) : []) };

// theme
const savedTheme = store.get("theme", null);
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
$("#theme").onclick = () => {
  const dark = document.documentElement.dataset.theme === "dark" ||
    (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  store.set("theme", document.documentElement.dataset.theme);
};

document.querySelectorAll(".tab").forEach(t => t.onclick = () => go(t.dataset.view));
function go(view, lec) {
  S.view = view; if (lec) S.lec = lec;
  const h = "#" + view + (["note","memo"].includes(view) ? "/" + S.lec : "");
  if (location.hash === h) route(); else location.hash = h; // same hash fires no hashchange
}
function route() {
  const [v, id] = location.hash.slice(1).split("/");
  S.view = ["home","note","memo","cards","quiz"].includes(v) ? v : "home";
  if (id && L.some(l => l.id === id)) S.lec = id;
  render();
}
addEventListener("hashchange", route);

function side() {
  const perLec = ["note","memo"].includes(S.view);
  $("#side").innerHTML = `<h4>주차 목록</h4>` + L.map((l, i) => `
    <button class="lec-link" data-id="${l.id}" aria-current="${perLec && l.id === S.lec}">
      <span class="dot" style="background:${tint(i)}">${esc(l.no)}</span><span>${esc(l.title)}</span></button>`).join("");
  $("#side").querySelectorAll(".lec-link").forEach(b => b.onclick = () => go(perLec ? S.view : "note", b.dataset.id));
  // mobile: the lecture list is a horizontal strip — keep the current one in view
  const cur = $("#side [aria-current=true]");
  if (cur) $("#side").scrollLeft = cur.offsetLeft - 16;
}

function render() {
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.view === S.view));
  side();
  ({ home, note, memo, cards, quiz })[S.view]();
  scrollTo(0, 0);
}

/* ---------- 홈 ---------- */
function home() {
  const nCards = L.reduce((s, l) => s + (l.cards?.length || 0), 0);
  const nQ = L.reduce((s, l) => s + (l.quiz?.length || 0), 0);
  const wrong = Object.keys(store.get("wrong", {})).length;
  $("#main").innerHTML = `
    <div class="eyebrow">2026학년도 2학기 · 제주대학교 · 중간고사 10/22(목) 수업시간 · 객관식 25문항 · 강의록 위주</div>
    <h1>인적자원개발론</h1>
    <p class="lead">1~7주 강의자료와 수업 필기(판서 사진·슬라이드 손글씨)를 합쳐 정리한 노트입니다. 정리노트로 이해하고, 암기노트·플래시카드로 외우고, 문제은행으로 반복 점검하세요.</p>
    <div class="grid stats">
      <div class="card tint" style="background:var(--t-lav)"><div class="stat">${L.filter(l => /^\d+$/.test(l.no)).length}</div><div class="meta">주차</div></div>
      <div class="card tint" style="background:var(--t-sky)"><div class="stat">${nCards}</div><div class="meta">플래시카드</div></div>
      <div class="card tint" style="background:var(--t-mint)"><div class="stat">${nQ}</div><div class="meta">문제</div></div>
      <div class="card tint" style="background:var(--t-rose)"><div class="stat">${wrong}</div><div class="meta">복습할 오답</div></div>
    </div>
    <div class="row"><input type="search" id="q" placeholder="전체 노트 검색 (예: 호손실험, ADDIE, 안드라고지)" style="flex:1;min-width:220px"></div>
    <div id="hits"></div>
    <h2>주차별 노트</h2>
    <div class="grid">${L.map((l, i) => `
      <button class="home-card" style="background:${tint(i)}" data-id="${l.id}">
        <span>${lno(l)}${l.date ? " · " + esc(l.date) : ""}</span><b>${esc(l.title)}</b>
        <span>${esc(l.summary || "")}</span></button>`).join("")}</div>
    <p class="foot">학습 기록(오답·카드 진행)은 이 브라우저에만 저장됩니다.</p>`;
  $("#main").querySelectorAll(".home-card").forEach(b => b.onclick = () => go("note", b.dataset.id));
  const plain = L.map(l => ({ l, text: (l.notes || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ") }));
  $("#q").oninput = e => {
    const q = e.target.value.trim();
    if (q.length < 2) { $("#hits").innerHTML = ""; return; }
    const hits = [];
    for (const { l, text } of plain) {
      let i = text.indexOf(q), n = 0;
      while (i >= 0 && n < 3) { hits.push({ l, s: text.slice(Math.max(0, i - 50), i + q.length + 70) }); i = text.indexOf(q, i + q.length); n++; }
    }
    $("#hits").innerHTML = hits.length ? hits.slice(0, 30).map(h => `
      <div class="search-hit"><small>${lno(h.l)} ${esc(h.l.title)}</small>
      <div>…${esc(h.s).replaceAll(esc(q), `<mark>${esc(q)}</mark>`)}…</div>
      <a href="#note/${h.l.id}">노트 열기 →</a></div>`).join("") : `<p class="empty">검색 결과 없음</p>`;
  };
}

/* ---------- 정리노트 ---------- */
function note() {
  const i = L.findIndex(l => l.id === S.lec), l = L[i];
  if (!l) { $("#main").innerHTML = `<p class="empty">데이터가 없습니다.</p>`; return; }
  $("#main").innerHTML = `
    <div class="eyebrow">${lno(l)} ${l.date ? "· " + esc(l.date) : ""}</div>
    <h1>${esc(l.title)}</h1>
    ${l.summary ? `<p class="lead">${esc(l.summary)}</p>` : ""}
    ${l.sources ? `<p class="meta">출처: ${esc(l.sources)}</p>` : ""}
    <nav class="toc" id="toc"></nav>
    <article class="note">${l.notes || ""}</article>
    <hr><div class="row">
      ${i > 0 ? `<button class="btn sec" data-go="${L[i-1].id}">← ${esc(L[i-1].title)}</button>` : ""}
      <span style="flex:1"></span>
      <button class="btn sec" onclick="go('memo')">암기노트 보기</button>
      ${i < L.length - 1 ? `<button class="btn" data-go="${L[i+1].id}">${esc(L[i+1].title)} →</button>` : ""}
    </div>`;
  const hs = [...$("#main").querySelectorAll(".note h2")];
  hs.forEach((h, k) => h.id = "s" + k);
  $("#toc").innerHTML = hs.length ? `<div class="eyebrow" style="margin-bottom:6px">목차</div>` +
    hs.map(h => `<a href="javascript:void 0" data-t="${h.id}">${esc(h.textContent)}</a>`).join("") : "";
  if (!hs.length) $("#toc").remove();
  $("#main").querySelectorAll("[data-t]").forEach(a => a.onclick = () => document.getElementById(a.dataset.t).scrollIntoView({ behavior: "smooth" }));
  $("#main").querySelectorAll("[data-go]").forEach(b => b.onclick = () => { go("note", b.dataset.go); scrollTo(0, 0); });
  scrollTo(0, 0);
}

/* ---------- 암기노트 ---------- */
function memo() {
  const l = L.find(l => l.id === S.lec);
  const hidden = store.get("memoHide", false);
  $("#main").innerHTML = `
    <div class="eyebrow">암기노트 · ${lno(l)}</div>
    <h1>${esc(l.title)}</h1>
    <div class="row" style="margin:16px 0">
      <button class="btn ${hidden ? "" : "sec"}" id="hideBtn">${hidden ? "가리기 켜짐 — 클릭해서 하나씩 확인" : "정답 가리기"}</button>
      <button class="btn sec" onclick="go('note')">정리노트로</button>
    </div>
    <div id="memoList" class="${hidden ? "hide" : ""}">
      ${(l.memo || []).map(m => `<div class="memo-item"><div class="k">${esc(m.k)}</div><div class="v">${m.v}</div></div>`).join("") || `<p class="empty">항목 없음</p>`}
    </div>`;
  $("#hideBtn").onclick = () => { store.set("memoHide", !hidden); memo(); };
  $("#memoList").querySelectorAll(".v").forEach(v => v.onclick = () => v.classList.toggle("show"));
  scrollTo(0, 0);
}

/* ---------- 강의 선택 칩 ---------- */
function picker() {
  return `<label>범위 (주차 선택)</label><div class="chips" id="chips">
    <button class="chip" data-all="1" aria-pressed="${S.sel.length === L.length}">전체</button>
    ${L.map(l => `<button class="chip" data-id="${l.id}" aria-pressed="${S.sel.includes(l.id)}">${esc(l.no)}. ${esc(l.title)}</button>`).join("")}</div>`;
}
function bindPicker(after) {
  $("#chips").querySelectorAll(".chip").forEach(c => c.onclick = () => {
    if (c.dataset.all) S.sel = S.sel.length === L.length ? [] : L.map(l => l.id);
    else S.sel = S.sel.includes(c.dataset.id) ? S.sel.filter(x => x !== c.dataset.id) : [...S.sel, c.dataset.id];
    store.set("sel", S.sel); store.set("selIds", L.map(l => l.id)); after();
  });
}

/* ---------- 플래시카드 ---------- */
let FC = null;
function cards() {
  if (FC) return fcPlay();
  const known = store.get("known", {});
  const pool = L.filter(l => S.sel.includes(l.id)).flatMap(l => (l.cards || []).map((c, k) => ({ ...c, key: l.id + ":" + k, lec: l })));
  const unknown = pool.filter(c => !known[c.key]);
  $("#main").innerHTML = `
    <div class="eyebrow">플래시카드</div><h1>카드 넘기며 외우기</h1>
    <p class="lead">카드를 눌러 뒤집고, 알면 <b>알아요</b>, 모르면 <b>다시</b>. 모르는 카드는 덱 뒤로 돌아가 다시 나옵니다.</p>
    <div class="panel">${picker()}
      <div class="row" style="margin-top:12px">
        <button class="btn" id="startAll" ${pool.length ? "" : "disabled"}>전체 ${pool.length}장 시작</button>
        <button class="btn sec" id="startUnknown" ${unknown.length ? "" : "disabled"}>아직 못 외운 ${unknown.length}장만</button>
        <button class="btn sec" id="resetKnown">외움 기록 초기화</button>
      </div></div>
    <p class="meta">단축키: <kbd>Space</kbd> 뒤집기 · <kbd>→</kbd> 알아요 · <kbd>←</kbd> 다시</p>`;
  bindPicker(cards);
  $("#startAll").onclick = () => { FC = { deck: shuffle(pool), done: 0, total: pool.length }; fcPlay(); };
  $("#startUnknown").onclick = () => { FC = { deck: shuffle(unknown), done: 0, total: unknown.length }; fcPlay(); };
  $("#resetKnown").onclick = () => { if (confirm("외움 표시를 모두 지울까요?")) { store.set("known", {}); cards(); } };
}
function fcPlay() {
  if (!FC.deck.length) {
    $("#main").innerHTML = `<div class="eyebrow">플래시카드</div><h1>덱 완료 🎉</h1>
      <p class="lead">${FC.total}장을 모두 외웠습니다.</p><button class="btn" id="back">처음으로</button>`;
    $("#back").onclick = () => { FC = null; cards(); }; return;
  }
  const c = FC.deck[0];
  $("#main").innerHTML = `
    <div class="row"><span class="pill">${lno(c.lec)} ${esc(c.lec.title)}</span><span style="flex:1"></span>
      <span class="meta">완료 ${FC.done} / ${FC.total} · 남은 카드 ${FC.deck.length}</span></div>
    <div class="progress" style="margin-top:10px"><i style="width:${FC.total ? FC.done / FC.total * 100 : 0}%"></i></div>
    <div class="fc-stage"><div class="fc" id="fc" tabindex="0" role="button" aria-label="카드 뒤집기">
      <div class="fc-face fc-front"><span class="tag">질문</span><div class="q">${esc(c.q)}</div><span class="hint">눌러서 뒤집기 · 좌우로 밀어 넘기기</span></div>
      <div class="fc-face fc-back"><span class="tag">정답</span><div class="a">${c.a}</div></div>
    </div></div>
    <div class="row" style="justify-content:center">
      <button class="btn bad" id="again">다시 ←</button>
      <button class="btn sec" id="flip">뒤집기</button>
      <button class="btn ok" id="know">알아요 →</button>
    </div>
    <div class="row" style="justify-content:center;margin-top:20px"><button class="btn sec" id="quit">그만하기</button></div>`;
  const fc = $("#fc");
  const flip = () => fc.classList.toggle("flip");
  const fit = () => { const f = fc.querySelectorAll(".fc-face"); fc.style.minHeight = Math.max(320, ...[...f].map(x => x.scrollHeight)) + "px"; };
  fit();
  fc.onclick = flip; $("#flip").onclick = flip;
  // swipe: right = 알아요, left = 다시 (vertical scroll stays native)
  let sx = 0, sy = 0;
  fc.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  fc.addEventListener("touchend", e => {
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    e.preventDefault(); // suppress the click → flip
    $(dx > 0 ? "#know" : "#again").click();
  });
  $("#know").onclick = () => { const k = store.get("known", {}); k[c.key] = 1; store.set("known", k); FC.deck.shift(); FC.done++; fcPlay(); };
  $("#again").onclick = () => { FC.deck.push(FC.deck.shift()); if (FC.deck.length > 2) { const x = FC.deck.pop(); FC.deck.splice(Math.min(3, FC.deck.length), 0, x); } fcPlay(); };
  $("#quit").onclick = () => { FC = null; cards(); };
}
addEventListener("keydown", e => {
  if (S.view === "quiz" && QZ && !e.target.matches("input,select,textarea")) {
    const o = document.querySelectorAll(".opt:not(:disabled)")[+e.key - 1];
    if (o) o.click();
    if (e.key === "Enter" && $("#next")) { e.preventDefault(); $("#next").click(); }
    return;
  }
  if (S.view !== "cards" || !FC || !$("#fc") || e.target.matches("input,select,textarea")) return;
  if (e.key === " ") { e.preventDefault(); $("#fc").classList.toggle("flip"); }
  if (e.key === "ArrowRight") $("#know").click();
  if (e.key === "ArrowLeft") $("#again").click();
});

/* ---------- 문제은행 ---------- */
let QZ = null;
function quiz() {
  if (QZ) return qzPlay();
  const wrong = store.get("wrong", {});
  const all = L.filter(l => S.sel.includes(l.id)).flatMap(l => (l.quiz || []).map((q, k) => ({ ...q, key: l.id + ":" + k, lec: l })));
  const wrongPool = all.filter(q => wrong[q.key]);
  const hist = store.get("hist", []);
  const cnt = store.get("qcount", 20);
  $("#main").innerHTML = `
    <div class="eyebrow">문제은행</div><h1>반복 문제 풀이</h1>
    <p class="lead">매번 문제 순서와 보기 순서가 섞입니다. 틀린 문제는 자동으로 오답노트에 쌓이고, 오답 모드에서 맞히면 빠집니다.</p>
    <div class="panel">${picker()}
      <div class="row" style="margin-top:12px">
        <div><label>문제 수</label><input type="number" id="cnt" min="5" max="${Math.max(5, all.length)}" value="${Math.min(cnt, all.length) || cnt}" style="width:90px"></div>
        <div><label>유형</label><select id="typ"><option value="all">전체</option><option value="mc">객관식만</option><option value="ox">OX만</option></select></div>
      </div>
      <div class="row" style="margin-top:14px">
        <button class="btn" id="go" ${all.length ? "" : "disabled"}>랜덤 시험 시작 (${all.length}문제 중)</button>
        <button class="btn sec" id="goWrong" ${wrongPool.length ? "" : "disabled"}>오답만 다시 풀기 (${wrongPool.length})</button>
        <button class="btn sec" id="clrWrong" ${Object.keys(wrong).length ? "" : "disabled"}>오답 기록 지우기</button>
      </div></div>
    ${hist.length ? `<h3>최근 기록</h3><table class="hist"><tr><th>일시</th><th>범위</th><th>점수</th></tr>
      ${hist.slice(-10).reverse().map(h => `<tr><td>${esc(h.t)}</td><td>${esc(h.r)}</td><td>${h.s} / ${h.n} (${Math.round(h.s / h.n * 100)}%)</td></tr>`).join("")}</table>` : ""}`;
  bindPicker(quiz);
  $("#typ").value = store.get("qtype", "all");
  const start = (pool, mode) => {
    const typ = $("#typ").value;
    store.set("qtype", typ);
    pool = pool.filter(q => typ === "all" || (q.type || "mc") === typ);
    const n = Math.max(1, Math.min(+$("#cnt").value || 20, pool.length));
    store.set("qcount", +$("#cnt").value || 20);
    if (!pool.length) return alert("해당 조건의 문제가 없습니다.");
    QZ = { mode, list: shuffle(pool).slice(0, mode === "wrong" ? pool.length : n).map(q => {
      const opts = q.type === "ox" ? ["O", "X"].map((t, i) => ({ t, ok: i === q.answer })) : shuffle(q.choices.map((t, i) => ({ t, ok: i === q.answer })));
      return { ...q, opts };
    }), i: 0, score: 0, picked: null, wrongs: [] };
    qzPlay();
  };
  $("#go").onclick = () => start(all, "rand");
  $("#goWrong").onclick = () => start(wrongPool, "wrong");
  $("#clrWrong").onclick = () => { if (confirm("오답 기록을 모두 지울까요?")) { store.set("wrong", {}); quiz(); } };
}
function qzPlay() {
  const Z = QZ;
  if (Z.i >= Z.list.length) return qzEnd();
  const q = Z.list[Z.i], answered = Z.picked !== null;
  $("#main").innerHTML = `
    <div class="row"><span class="pill">${lno(q.lec)} ${esc(q.lec.title)}</span><span class="pill">${q.type === "ox" ? "OX" : "객관식"}</span>
      <span style="flex:1"></span><span class="meta">${Z.i + 1} / ${Z.list.length} · 정답 ${Z.score}</span></div>
    <div class="progress" style="margin-top:10px"><i style="width:${Z.i / Z.list.length * 100}%"></i></div>
    <div class="q-box"><div class="q-text">${esc(q.q)}</div>
      ${q.opts.map((o, k) => `<button class="opt ${answered ? (o.ok ? "correct" : k === Z.picked ? "wrong" : "") : ""}" data-k="${k}" ${answered ? "disabled" : ""}>
        <span class="n">${q.type === "ox" ? "" : "①②③④⑤"[k]}</span><span>${esc(o.t)}</span></button>`).join("")}
      ${answered ? `<div class="explain">${q.opts[Z.picked].ok ? `<b class="okc">정답!</b>` : `<b class="badc">오답</b> — 정답: ${esc(q.opts.find(o => o.ok).t)}`}
        <div style="margin-top:6px">${q.explain || ""}</div></div>` : ""}
    </div>
    <div class="row">${answered ? `<button class="btn" id="next">${Z.i + 1 < Z.list.length ? "다음 문제 →" : "결과 보기"}</button>` : ""}
      <span style="flex:1"></span><button class="btn sec" id="quitQ">그만하기</button></div>
    <p class="meta" style="margin-top:12px">단축키: <kbd>1</kbd>~<kbd>5</kbd> 선택 · <kbd>Enter</kbd> 다음</p>`;
  $("#main").querySelectorAll(".opt").forEach(b => b.onclick = () => {
    Z.picked = +b.dataset.k;
    const ok = q.opts[Z.picked].ok, w = store.get("wrong", {});
    if (ok) { Z.score++; if (Z.mode === "wrong") delete w[q.key]; }
    else { w[q.key] = (w[q.key] || 0) + 1; Z.wrongs.push(q); }
    store.set("wrong", w); qzPlay();
  });
  if (answered) $("#next").onclick = () => { Z.i++; Z.picked = null; qzPlay(); scrollTo(0, 0); };
  $("#quitQ").onclick = () => { QZ = null; quiz(); };
}
function qzEnd() {
  const Z = QZ, pct = Math.round(Z.score / Z.list.length * 100);
  const h = store.get("hist", []);
  h.push({ t: new Date().toLocaleString("ko-KR"), r: Z.mode === "wrong" ? "오답 복습" : S.sel.length === L.length ? "전체" : S.sel.map(id => L.find(l => l.id === id)?.no).join(","), s: Z.score, n: Z.list.length });
  store.set("hist", h.slice(-50));
  $("#main").innerHTML = `
    <div class="eyebrow">결과</div><h1>${Z.score} / ${Z.list.length} <span style="color:var(--steel);font-size:24px">(${pct}%)</span></h1>
    <p class="lead">${pct >= 90 ? "훌륭합니다. 오답만 한 번 더 확인하세요." : pct >= 70 ? "좋아요. 틀린 부분을 노트에서 다시 보세요." : "노트를 다시 읽고 오답 모드로 반복해 보세요."}</p>
    <div class="row" style="margin:16px 0"><button class="btn" id="again">새 시험</button></div>
    ${Z.wrongs.length ? `<h2>틀린 문제</h2>` + Z.wrongs.map(q => `<div class="q-box"><span class="pill">${lno(q.lec)}</span>
      <div class="q-text" style="margin-top:8px">${esc(q.q)}</div><div>정답: <b>${esc(q.opts.find(o => o.ok).t)}</b></div>
      <div class="explain">${q.explain || ""}</div><a href="#note/${q.lec.id}">노트에서 보기 →</a></div>`).join("") : ""}`;
  QZ = null;
  $("#again").onclick = quiz;
}

route();
</script>
</body>
</html>
